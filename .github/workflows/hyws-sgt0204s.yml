name: Build RTLPlayground Firmware

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build HYWS_SGT0204S
    runs-on: ubuntu-latest

    container:
      image: debian:trixie

    steps:
      # ============================================================
      # 1. Checkout source
      # ============================================================
      - name: Checkout source
        uses: actions/checkout@v6

      # ============================================================
      # 2. Install dependencies
      # ============================================================
      - name: Install dependencies
        run: |
          apt update
          apt install -y \
            make \
            gcc \
            sdcc \
            xxd \
            python-is-python3 \
            libjson-c-dev \
            zlib1g-dev

      # ============================================================
      # 3. Host-side unit tests
      # ============================================================
      - name: Run the host-side unit tests
        run: |
          make -C test

      # ============================================================
      # 4. Check all machine configurations
      # ============================================================
      - name: Check if machine.c can be compiled for all machines
        run: |
          make machine_check

      # ============================================================
      # 5. Build HYWS_SGT0204S firmware
      # ============================================================
      - name: Build HYWS_SGT0204S
        run: |
          echo "===== Building HYWS_SGT0204S ====="
          make CI=1 MACHINE="HYWS_SGT0204S"

      # ============================================================
      # 6. Show build output
      # ============================================================
      - name: List build output
        run: |
          echo "===== Build output ====="
          find output -type f -maxdepth 2 -print
          echo "===== File information ====="
          find output -type f -maxdepth 2 -exec ls -lh {} \;

      # ============================================================
      # 7. Upload firmware artifact
      # ============================================================
      - name: Upload HYWS_SGT0204S firmware
        uses: actions/upload-artifact@v4
        with:
          name: rtlplayground-HYWS_SGT0204S
          path: |
            output/**/*HYWS_SGT0204S*.bin
            output/**/*HYWS_SGT0204S*.hex
            output/**/*HYWS_SGT0204S*.img
          if-no-files-found: error
          retention-days: 30
