name: HYWS-SGT0204S

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build HYWS_SGT0204S
    runs-on: ubuntu-latest

    container:
      image: debian:trixie

    steps:

      # ============================================================
      # 1. Install dependencies FIRST
      #    Git must exist before actions/checkout runs
      # ============================================================
      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y \
            git \
            ca-certificates \
            make \
            gcc \
            sdcc \
            xxd \
            python3 \
            python-is-python3 \
            libjson-c-dev \
            zlib1g-dev \
            file \
            coreutils

      # ============================================================
      # 2. Checkout source
      # ============================================================
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # ============================================================
      # 3. Verify Git repository
      # ============================================================
      - name: Check Git version
        run: |
          echo "===== Git version ====="
          git --version

          echo
          echo "===== Repository ====="
          git rev-parse --is-inside-work-tree

          echo
          echo "===== Current commit ====="
          git rev-parse --short HEAD

          echo
          echo "===== Tags ====="
          git tag --list

          echo
          echo "===== Git describe ====="
          git describe --tags --always --dirty

          echo
          echo "===== Git status ====="
          git status --short

      # ============================================================
      # 4. Host-side unit tests
      # ============================================================
      - name: Run the host-side unit tests
        run: |
          make -C test

      # ============================================================
      # 5. Check all machine configurations
      # ============================================================
      - name: Check if machine.c can be compiled for all machines
        run: |
          make machine_check

      # ============================================================
      # 6. Build HYWS_SGT0204S firmware
      # ============================================================
      - name: Build HYWS_SGT0204S
        run: |
          echo "===== Building HYWS_SGT0204S ====="
          make CI=1 MACHINE="HYWS_SGT0204S"

      # ============================================================
      # 7. Show build output
      # ============================================================
      - name: List build output
        run: |
          echo "===== Build output ====="
          find output -maxdepth 2 -type f -print

          echo
          echo "===== File information ====="
          find output -maxdepth 2 -type f -exec ls -lh {} \;

      # ============================================================
      # 8. Upload firmware artifact
      # ============================================================
      - name: Upload HYWS_SGT0204S firmware
        uses: actions/upload-artifact@v4
        with:
          name: rtlplayground-HYWS_SGT0204S
          path: |
            output/**/*HYWS_SGT0204S*.bin
            output/**/*HYWS_SGT0204S*.hex
            output/**/*HYWS_SGT0204S*.img
          if-no-files-found: error
          retention-days: 30
