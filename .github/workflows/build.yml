name: Build RTLPlayground firmware

on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: debian:trixie

    steps:
      - name: Install Git
        run: |
          apt-get update
          apt-get install -y git

      - name: Checkout source
        uses: actions/checkout@v6

      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y \
            make \
            gcc \
            sdcc \
            xxd \
            python-is-python3 \
            libjson-c-dev \
            binutils \
            findutils

      - name: Check machine definitions
        run: |
          make machine_check

      - name: Build firmware
        run: |
          make MACHINE=PCB_SWTG024AS_A_2_0_1

      - name: List output
        run: |
          find output -type f -name "*.bin"

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: RTLPlayground-PCB_SWTG024AS_A_2_0_1
          path: |
            output/PCB_SWTG024AS_A_2_0_1/*.bin
