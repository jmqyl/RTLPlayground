name: Build RTLPlayground FG-4GT-2SX_V2.0

on:
  workflow_dispatch:

  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: debian:trixie

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          apt update
          apt install -y \
            make \
            gcc \
            sdcc \
            xxd \
            python-is-python3 \
            libjson-c-dev

      - name: Show SDCC version
        run: |
          sdcc --version

      - name: Clean
        run: |
          make clean || true
          rm -rf output

      - name: Build FG-4GT-2SX_V2.0
        run: |
          make MACHINE=FG_4GT_2SX_V2_0

      - name: Show firmware
        run: |
          ls -lh output/

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: RTLPlayground-FG-4GT-2SX_V2.0
          path: output/*FG_4GT_2SX_V2_0.bin
          if-no-files-found: error
          retention-days: 30
