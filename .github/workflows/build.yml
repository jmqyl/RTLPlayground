name: Build RY-4GT-2SX UI Firmware

on:
  push:
    branches:
      - ry-4gt-2sx-ui
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: debian:trixie

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install dependencies
        run: |
          apt update
          apt install -y \
            make \
            gcc \
            sdcc \
            xxd \
            python-is-python3 \
            libjson-c-dev

      - name: Apply UI patch
        run: |
          git apply --check patches/ry-4gt-2sx-ui-mod.patch
          git apply patches/ry-4gt-2sx-ui-mod.patch

      - name: Build
        run: |
          make clean
          make MACHINE=SWGT024_V2_0_UNMANAGED

      - name: Check firmware size
        run: |
          find output -name "*.bin" -exec ls -lh {} \;

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: RY-4GT-2SX-UI
          path: output/**/*.bin
