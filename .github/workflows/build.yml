name: Build firmware

on:
  push:
    branches: ['**']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: debian:trixie

    steps:
      - uses: actions/checkout@v6

      - name: Install dependencies
        run: |
          apt update
          apt install -y \
            make \
            gcc \
            sdcc \
            xxd \
            python-is-python3 \
            libjson-c-dev

      - name: Check if machine.c can be compiled for all machines
        run: |
          make machine_check

      - name: Make project
        run: |
          make MACHINE="FG_4GT_2SX_V2_0"

      - name: Show BIN file
        run: |
          echo "===== Generated BIN ====="
          find output -type f -name "*.bin" -exec ls -lh {} \;

      - name: Upload BIN firmware
        uses: actions/upload-artifact@v4
        with:
          name: rtlplayground-FG_4GT_2SX_V2_0
          path: output/*.bin
          if-no-files-found: error
          retention-days: 30
