name: Build RY-4GT-2SX Firmware

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build RY-4GT-2SX
    runs-on: ubuntu-latest

    container:
      image: debian:trixie

    steps:

      # ============================================================
      # 1. Checkout fixed build baseline
      # ============================================================
      - name: Checkout RTLPlayground c86d4b3
        uses: actions/checkout@v6
        with:
          ref: c86d4b3
          fetch-depth: 1

      # ============================================================
      # 2. Install dependencies
      # ============================================================
      - name: Install dependencies
        run: |
          set -e

          apt-get update

          apt-get install -y \
            make \
            gcc \
            sdcc \
            xxd \
            python3 \
            python-is-python3 \
            libjson-c-dev \
            file \
            coreutils \
            patch \
            ca-certificates

          echo "===== Tools ====="

          make --version
          sdcc --version
          gcc --version
          python3 --version
          patch --version

      # ============================================================
      # 3. Verify source files
      # ============================================================
      - name: Verify source baseline
        run: |
          set -e

          echo "======================================"
          echo " SOURCE BASELINE"
          echo "======================================"
          echo
          echo "Expected RTLPlayground:"
          echo "commit c86d4b3 (v0.1.0)"
          echo

          echo "Checking source files..."

          test -f Makefile
          test -f machine.c
          test -f config.txt

          echo "Source tree OK"

          echo
          echo "Makefile:"
          ls -lh Makefile

          echo
          echo "machine.c:"
          ls -lh machine.c

      # ============================================================
      # 4. Check patch
      # ============================================================
      - name: Check UI patch
        run: |
          set -e

          echo "===== Checking UI patch ====="

          if [ ! -f patches/ry-4gt-2sx-ui-mod.patch ]; then
            echo
            echo "ERROR: UI patch not found!"
            echo
            find . -type f -name "*.patch" -print
            exit 1
          fi

          echo
          echo "Patch found:"
          ls -lh patches/ry-4gt-2sx-ui-mod.patch

      # ============================================================
      # 5. Test patch
      # ============================================================
      - name: Check patch compatibility
        run: |
          set -e

          echo "===== Checking patch compatibility ====="

          patch \
            --dry-run \
            -p1 \
            < patches/ry-4gt-2sx-ui-mod.patch

          echo
          echo "======================================"
          echo " PATCH CHECK PASSED"
          echo "======================================"

      # ============================================================
      # 6. Apply patch
      # ============================================================
      - name: Apply UI patch
        run: |
          set -e

          echo "===== Applying UI patch ====="

          patch \
            -p1 \
            < patches/ry-4gt-2sx-ui-mod.patch

          echo
          echo "===== UI patch applied ====="

      # ============================================================
      # 7. Verify machine target
      # ============================================================
      - name: Verify machine
        run: |
          set -e

          echo "===== Checking machine ====="

          if grep -R \
            "SWGT024_V2_0_UNMANAGED" \
            machine.c \
            Makefile \
            config.txt \
            2>/dev/null; then

            echo
            echo "Machine target found."

          else

            echo
            echo "ERROR: SWGT024_V2_0_UNMANAGED not found."
            exit 1

          fi

      # ============================================================
      # 8. Clean
      # ============================================================
      - name: Clean build
        run: |
          set -e

          make clean || true

          rm -rf output
          rm -rf release

          mkdir -p output
          mkdir -p release

      # ============================================================
      # 9. Build
      # ============================================================
      - name: Build firmware
        run: |
          set -e

          echo "======================================"
          echo " Building RY-4GT-2SX Firmware"
          echo "======================================"
          echo
          echo "Base    : RTLPlayground c86d4b3"
          echo "Board   : RY-4GT-2SX"
          echo "PCB     : FG-4GT-2SX_V2.0"
          echo "Chip    : RTL8372N"
          echo "Ports   : 4 x 2.5G + 2 x SFP+"
          echo "Machine : SWGT024_V2_0_UNMANAGED"
          echo
          echo "======================================"

          make MACHINE=SWGT024_V2_0_UNMANAGED

      # ============================================================
      # 10. Find firmware
      # ============================================================
      - name: Find firmware
        run: |
          set -e

          echo "===== Build output ====="

          find output -type f -exec ls -lh {} \;

          echo
          echo "===== BIN files ====="

          find output \
            -type f \
            -name "*.bin" \
            -exec ls -lh {} \;

      # ============================================================
      # 11. Verify firmware
      # ============================================================
      - name: Verify firmware
        run: |
          set -e

          BIN=$(find output \
            -type f \
            -name "*.bin" \
            | head -n 1)

          if [ -z "$BIN" ]; then
            echo "ERROR: No firmware found!"
            exit 1
          fi

          echo "Firmware:"
          echo "$BIN"

          echo
          echo "File:"
          file "$BIN"

          echo
          echo "Size:"
          stat -c "%s bytes" "$BIN"

      # ============================================================
      # 12. Require exactly 512 KiB
      # ============================================================
      - name: Verify firmware size
        run: |
          set -e

          BIN=$(find output \
            -type f \
            -name "*.bin" \
            | head -n 1)

          SIZE=$(stat -c%s "$BIN")

          echo "======================================"
          echo " FIRMWARE SIZE CHECK"
          echo "======================================"
          echo
          echo "Actual   : $SIZE bytes"
          echo "Expected : 524288 bytes"
          echo

          if [ "$SIZE" -ne 524288 ]; then
            echo "ERROR: Firmware is not 512 KiB!"
            exit 1
          fi

          echo "512 KiB CHECK PASSED"

      # ============================================================
      # 13. Prepare final firmware
      # ============================================================
      - name: Prepare firmware
        run: |
          set -e

          BIN=$(find output \
            -type f \
            -name "*.bin" \
            | head -n 1)

          FINAL="release/rtlplayground-RY-4GT-2SX.bin"

          cp "$BIN" "$FINAL"

          echo "===== Final firmware ====="

          ls -lh "$FINAL"

          echo
          echo "Size:"
          stat -c "%s bytes" "$FINAL"

      # ============================================================
      # 14. Final checksum
      # ============================================================
      - name: Calculate checksum
        run: |
          set -e

          FINAL="release/rtlplayground-RY-4GT-2SX.bin"

          echo "===== MD5 ====="
          md5sum "$FINAL"

          echo
          echo "===== SHA256 ====="
          sha256sum "$FINAL"

      # ============================================================
      # 15. Final verification
      # ============================================================
      - name: Final verification
        run: |
          set -e

          FINAL="release/rtlplayground-RY-4GT-2SX.bin"

          test -f "$FINAL"

          SIZE=$(stat -c%s "$FINAL")

          if [ "$SIZE" -ne 524288 ]; then
            echo "ERROR: Final firmware size is $SIZE bytes"
            exit 1
          fi

          echo "======================================"
          echo " BUILD SUCCESS"
          echo "======================================"
          echo
          echo "File:"
          echo "$FINAL"
          echo
          echo "Size:"
          echo "$SIZE bytes"
          echo
          echo "MD5:"
          md5sum "$FINAL"
          echo
          echo "SHA256:"
          sha256sum "$FINAL"

      # ============================================================
      # 16. Upload final firmware
      # ============================================================
      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: RY-4GT-2SX-Firmware
          path: release/rtlplayground-RY-4GT-2SX.bin
          if-no-files-found: error
          retention-days: 30

      # ============================================================
      # 17. Upload build output
      # ============================================================
      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: RY-4GT-2SX-Build-Output
          path: output/
          if-no-files-found: error
          retention-days: 30
