- name: Install dependencies
  run: |
    apt update
    apt install -y make gcc sdcc xxd python-is-python3 libjson-c-dev
    # 若 tools 需要额外库，可在此添加，例如 flex, bison, libssl-dev 等

- name: Build tools
  run: make tools

- name: Check environment
  run: |
    echo "MACHINE = FG_4GT_2SX_V2_0"
    ls -la html/ config.txt || true

- name: Build firmware
  run: make all MACHINE="FG_4GT_2SX_V2_0"

- name: List generated files
  run: find output -type f -name "*.bin" -ls

- name: Upload firmware
  uses: actions/upload-artifact@v4
  with:
    name: firmware
    path: output/FG_4GT_2SX_V2_0/*.bin
