name: Build RY-4GT-2SX Firmware

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build RY-4GT-2SX
    runs-on: ubuntu-latest

    container:
      image: debian:trixie

    steps:

      # ============================================================
      # 1. Checkout
      # IMPORTANT:
      # The UI patch is based on RTLPlayground commit c86d4b3
      # ============================================================
      - name: Checkout RTLPlayground c86d4b3
        uses: actions/checkout@v6
        with:
          ref: c86d4b3
          fetch-depth: 1

      # ============================================================
      # 2. Install build dependencies
      # ============================================================
      - name: Install dependencies
        run: |
          set -e

          echo "===== Updating packages ====="

          apt-get update

          apt-get install -y \
            make \
            gcc \
            sdcc \
            xxd \
            python3 \
            python-is-python3 \
            libjson-c-dev \
            file \
            coreutils \
            patch \
            git \
            ca-certificates

          echo
          echo "===== Tool versions ====="

          make --version
          echo
          sdcc --version
          echo
          gcc --version
          echo
          python3 --version
          echo
          patch --version

      # ============================================================
      # 3. Verify source revision
      # ============================================================
      - name: Verify source revision
        run: |
          set -e

          echo "===== Git revision ====="

          git rev-parse HEAD

          echo
          echo "Expected:"
          echo "c86d4b3"

          echo
          echo "Actual:"
          git rev-parse --short HEAD

          if [ "$(git rev-parse --short HEAD)" != "c86d4b3" ]; then
            echo
            echo "ERROR: Wrong source revision!"
            exit 1
          fi

          echo
          echo "SOURCE REVISION CHECK PASSED"

      # ============================================================
      # 4. Check patch
      # ============================================================
      - name: Check UI patch
        run: |
          set -e

          echo "===== Checking UI patch ====="

          if [ ! -f "patches/ry-4gt-2sx-ui-mod.patch" ]; then
            echo
            echo "ERROR: UI patch not found!"
            echo
            echo "Expected:"
            echo "patches/ry-4gt-2sx-ui-mod.patch"
            echo
            echo "Existing patch files:"
            find . -type f -name "*.patch" -print
            exit 1
          fi

          echo
          echo "Patch found:"
          ls -lh patches/ry-4gt-2sx-ui-mod.patch

      # ============================================================
      # 5. Dry-run patch
      # ============================================================
      - name: Check patch compatibility
        run: |
          set -e

          echo "===== Checking patch compatibility ====="

          patch \
            --dry-run \
            -p1 \
            < patches/ry-4gt-2sx-ui-mod.patch

          echo
          echo "======================================"
          echo " PATCH CHECK PASSED"
          echo "======================================"

      # ============================================================
      # 6. Apply UI patch
      # ============================================================
      - name: Apply UI patch
        run: |
          set -e

          echo "===== Applying UI patch ====="

          patch \
            -p1 \
            < patches/ry-4gt-2sx-ui-mod.patch

          echo
          echo "===== UI patch applied ====="

          echo
          echo "===== Modified files ====="

          git status --short || true

      # ============================================================
      # 7. Verify machine configuration
      # ============================================================
      - name: Verify machine
        run: |
          set -e

          echo "===== Checking machine ====="

          echo
          echo "Searching SWGT024_V2_0_UNMANAGED..."

          if grep -R \
            "SWGT024_V2_0_UNMANAGED" \
            machine.c \
            Makefile \
            config.txt \
            2>/dev/null; then

            echo
            echo "Machine target found."

          else

            echo
            echo "ERROR: SWGT024_V2_0_UNMANAGED not found."
            exit 1

          fi

      # ============================================================
      # 8. Show important build configuration
      # ============================================================
      - name: Show build configuration
        run: |
          echo "======================================"
          echo " RY-4GT-2SX BUILD CONFIGURATION"
          echo "======================================"
          echo
          echo "Board : RY-4GT-2SX"
          echo "PCB   : FG-4GT-2SX_V2.0"
          echo "Chip  : RTL8372N"
          echo "Ports : 4 x 2.5G + 2 x SFP+"
          echo "Target: SWGT024_V2_0_UNMANAGED"
          echo "Base  : c86d4b3"
          echo
          echo "Expected firmware size:"
          echo "524288 bytes (512 KiB)"
          echo
          echo "======================================"

      # ============================================================
      # 9. Clean previous build
      # ============================================================
      - name: Clean build
        run: |
          set -e

          echo "===== Cleaning build ====="

          make clean || true

          rm -rf output
          rm -rf release

          mkdir -p output
          mkdir -p release

      # ============================================================
      # 10. Build firmware
      # ============================================================
      - name: Build firmware
        run: |
          set -e

          echo "======================================"
          echo " Building firmware"
          echo "======================================"

          make MACHINE=SWGT024_V2_0_UNMANAGED

          echo
          echo "===== Build finished ====="

      # ============================================================
      # 11. List output
      # ============================================================
      - name: List build output
        run: |
          echo "===== Build output ====="

          find output \
            -type f \
            -exec ls -lh {} \;

          echo
          echo "===== BIN files ====="

          find output \
            -type f \
            -name "*.bin" \
            -exec ls -lh {} \;

      # ============================================================
      # 12. Verify firmware exists
      # ============================================================
      - name: Verify firmware exists
        run: |
          set -e

          echo "===== Checking firmware ====="

          BIN=$(find output \
            -type f \
            -name "*.bin" \
            | head -n 1)

          if [ -z "$BIN" ]; then
            echo
            echo "ERROR: No .bin firmware found!"
            exit 1
          fi

          echo
          echo "Firmware:"
          echo "$BIN"

          echo
          echo "File information:"
          file "$BIN"

      # ============================================================
      # 13. Verify firmware size
      # ============================================================
      - name: Verify firmware size
        run: |
          set -e

          echo "===== Checking firmware size ====="

          BIN=$(find output \
            -type f \
            -name "*.bin" \
            | head -n 1)

          SIZE=$(stat -c%s "$BIN")

          echo
          echo "Firmware : $BIN"
          echo "Actual   : $SIZE bytes"
          echo "Expected : 524288 bytes"
          echo

          if [ "$SIZE" -ne 524288 ]; then

            echo "======================================"
            echo " ERROR: WRONG FIRMWARE SIZE"
            echo "======================================"
            echo
            echo "Expected exactly 512 KiB."
            echo "Actual size: $SIZE bytes"
            echo

            exit 1
          fi

          echo "======================================"
          echo " 512 KiB CHECK PASSED"
          echo "======================================"

      # ============================================================
      # 14. Calculate checksum
      # ============================================================
      - name: Calculate checksum
        run: |
          set -e

          BIN=$(find output \
            -type f \
            -name "*.bin" \
            | head -n 1)

          echo "===== Firmware checksum ====="

          echo
          echo "MD5:"
          md5sum "$BIN"

          echo
          echo "SHA256:"
          sha256sum "$BIN"

          echo
          echo "===== Firmware size ====="
          stat -c "%s bytes" "$BIN"

      # ============================================================
      # 15. Prepare final firmware
      # ============================================================
      - name: Prepare firmware
        run: |
          set -e

          BIN=$(find output \
            -type f \
            -name "*.bin" \
            | head -n 1)

          FINAL="release/rtlplayground-RY-4GT-2SX.bin"

          echo "===== Preparing final firmware ====="

          cp "$BIN" "$FINAL"

          echo
          echo "Final firmware:"
          ls -lh "$FINAL"

          echo
          echo "Final size:"
          stat -c "%s bytes" "$FINAL"

          echo
          echo "Final checksum:"
          md5sum "$FINAL"
          sha256sum "$FINAL"

      # ============================================================
      # 16. Final verification
      # ============================================================
      - name: Final verification
        run: |
          set -e

          FINAL="release/rtlplayground-RY-4GT-2SX.bin"

          echo "======================================"
          echo " FINAL FIRMWARE VERIFICATION"
          echo "======================================"

          if [ ! -f "$FINAL" ]; then
            echo "ERROR: Final firmware not found!"
            exit 1
          fi

          SIZE=$(stat -c%s "$FINAL")

          echo
          echo "File:"
          echo "$FINAL"

          echo
          echo "Size:"
          echo "$SIZE bytes"

          if [ "$SIZE" -ne 524288 ]; then
            echo
            echo "ERROR: Final firmware is not 512 KiB!"
            exit 1
          fi

          echo
          echo "MD5:"
          md5sum "$FINAL"

          echo
          echo "SHA256:"
          sha256sum "$FINAL"

          echo
          echo "======================================"
          echo " BUILD SUCCESS"
          echo "======================================"

      # ============================================================
      # 17. Upload final firmware
      # ============================================================
      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: RY-4GT-2SX-Firmware
          path: release/rtlplayground-RY-4GT-2SX.bin
          if-no-files-found: error
          retention-days: 30

      # ============================================================
      # 18. Upload complete build output
      # ============================================================
      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: RY-4GT-2SX-Build-Output
          path: output/
          if-no-files-found: error
          retention-days: 30
