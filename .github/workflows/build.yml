name: Build RY-4GT-2SX Firmware

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  build:
    name: Build RY-4GT-2SX
    runs-on: ubuntu-latest

    container:
      image: debian:trixie

    steps:

      # =====================================================
      # 1. Checkout source
      # =====================================================
      - name: Checkout source
        uses: actions/checkout@v6

      # =====================================================
      # 2. Install dependencies
      # =====================================================
      - name: Install dependencies
        run: |
          apt-get update

          apt-get install -y \
            make \
            gcc \
            sdcc \
            xxd \
            python3 \
            python-is-python3 \
            libjson-c-dev \
            file \
            coreutils \
            patch \
            curl \
            ca-certificates

          echo "===== Tools ====="
          make --version
          sdcc --version
          gcc --version
          python3 --version
          patch --version

      # =====================================================
      # 3. Check source tree
      # =====================================================
      - name: Check source tree
        run: |
          echo "===== Current directory ====="
          pwd

          echo
          echo "===== Repository files ====="
          ls -la

          echo
          echo "===== Source files ====="
          find . -maxdepth 2 -type f | sort | head -200

      # =====================================================
      # 4. Check UI patch
      # =====================================================
      - name: Check UI patch
        run: |
          echo "===== Checking UI patch ====="

          if [ ! -f "patches/ry-4gt-2sx-ui-mod.patch" ]; then
            echo
            echo "ERROR: UI patch not found!"
            echo
            echo "Expected:"
            echo "patches/ry-4gt-2sx-ui-mod.patch"
            echo
            echo "Existing patch files:"
            find . -type f -name "*.patch" -print
            exit 1
          fi

          echo
          echo "Patch found:"
          ls -lh patches/ry-4gt-2sx-ui-mod.patch

      # =====================================================
      # 5. Check patch compatibility
      # =====================================================
      - name: Check patch compatibility
        run: |
          echo "===== Checking patch compatibility ====="

          patch \
            --dry-run \
            -p1 \
            < patches/ry-4gt-2sx-ui-mod.patch

          echo
          echo "======================================"
          echo " PATCH CHECK PASSED"
          echo "======================================"

      # =====================================================
      # 6. Apply UI patch
      # =====================================================
      - name: Apply UI patch
        run: |
          echo "===== Applying UI patch ====="

          patch \
            -p1 \
            < patches/ry-4gt-2sx-ui-mod.patch

          echo
          echo "===== UI patch applied ====="

      # =====================================================
      # 7. Verify machine
      # =====================================================
      - name: Verify machine
        run: |
          echo "===== Checking machine ====="

          if grep -R \
            "SWGT024_V2_0_UNMANAGED" \
            machine.c \
            Makefile \
            config.txt \
            2>/dev/null; then

            echo
            echo "Machine target found."

          else

            echo
            echo "WARNING: SWGT024_V2_0_UNMANAGED not found."
            echo "Please check machine configuration."

          fi

      # =====================================================
      # 8. Clean build
      # =====================================================
      - name: Clean build
        run: |
          echo "===== Cleaning build ====="

          make clean || true

          rm -rf output
          mkdir -p output

      # =====================================================
      # 9. Build firmware
      # =====================================================
      - name: Build firmware
        run: |
          echo "======================================"
          echo " Building firmware"
          echo
          echo " Board : RY-4GT-2SX"
          echo " PCB   : FG-4GT-2SX_V2.0"
          echo " Chip  : RTL8372N"
          echo " Ports : 4 x 2.5G + 2 x SFP+"
          echo " Target: SWGT024_V2_0_UNMANAGED"
          echo "======================================"

          make MACHINE=SWGT024_V2_0_UNMANAGED

      # =====================================================
      # 10. List output
      # =====================================================
      - name: List build output
        run: |
          echo "===== Firmware output ====="

          find output \
            -type f \
            -name "*.bin" \
            -exec ls -lh {} \;

          echo
          echo "===== All output ====="

          find output \
            -type f \
            -exec ls -lh {} \;

      # =====================================================
      # 11. Verify firmware exists
      # =====================================================
      - name: Verify firmware exists
        run: |
          BIN=$(find output \
            -type f \
            -name "*.bin" \
            | head -n 1)

          if [ -z "$BIN" ]; then
            echo
            echo "ERROR: No .bin firmware found!"
            exit 1
          fi

          echo
          echo "Firmware:"
          echo "$BIN"

          echo
          echo "File information:"
          file "$BIN"

      # =====================================================
      # 12. Verify firmware size
      # =====================================================
      - name: Verify firmware size
        run: |
          BIN=$(find output \
            -type f \
            -name "*.bin" \
            | head -n 1)

          SIZE=$(stat -c%s "$BIN")

          echo "======================================"
          echo " Firmware size"
          echo "======================================"
          echo
          echo "File:"
          echo "$BIN"
          echo
          echo "Actual:"
          echo "$SIZE bytes"
          echo
          echo "Expected:"
          echo "524288 bytes"
          echo "512 KiB"

          if [ "$SIZE" -ne 524288 ]; then
            echo
            echo "ERROR: Firmware size is not 512 KiB!"
            exit 1
          fi

          echo
          echo "======================================"
          echo " 512 KiB CHECK PASSED"
          echo "======================================"

      # =====================================================
      # 13. Calculate checksum
      # =====================================================
      - name: Calculate checksum
        run: |
          BIN=$(find output \
            -type f \
            -name "*.bin" \
            | head -n 1)

          echo "===== MD5 ====="
          md5sum "$BIN"

          echo
          echo "===== SHA256 ====="
          sha256sum "$BIN"

      # =====================================================
      # 14. Prepare firmware
      # =====================================================
      - name: Prepare firmware
        run: |
          BIN=$(find output \
            -type f \
            -name "*.bin" \
            | head -n 1)

          rm -rf release
          mkdir -p release

          cp "$BIN" \
            release/rtlplayground-RY-4GT-2SX.bin

          echo "===== Release firmware ====="
          ls -lh release/

      # =====================================================
      # 15. Upload firmware
      # =====================================================
      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: RY-4GT-2SX-Firmware
          path: release/rtlplayground-RY-4GT-2SX.bin
          if-no-files-found: error
          retention-days: 30

      # =====================================================
      # 16. Upload complete output
      # =====================================================
      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: RY-4GT-2SX-Build-Output
          path: output/
          if-no-files-found: error
          retention-days: 30
