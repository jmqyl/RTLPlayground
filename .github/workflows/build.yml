name: Build RTLPlayground Firmware

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y sdcc xxd libjson-c-dev python3

    - name: Build firmware for FG-4GT-2SX_V2_0
      run: |
        make clean
        make MACHINE=FG_4GT_2SX_V2_0

    - name: Upload firmware artifact
      uses: actions/upload-artifact@v4
      with:
        name: rtlplayground-firmware
        path: output/rtlplayground.bin
