name: Build RY-4GT-2SX Firmware

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build RY-4GT-2SX
    runs-on: ubuntu-latest

    container:
      image: debian:trixie

    steps:

      # ============================================================
      # 1. Checkout RTLPlayground
      #
      # IMPORTANT:
      # UI patch is based on commit c86d4b3 (v0.1.0)
      # ============================================================
      - name: Checkout RTLPlayground c86d4b3
        uses: actions/checkout@v6
        with:
          ref: c86d4b3
          fetch-depth: 1

      # ============================================================
      # 2. Checkout patch from current main
      #
      # The patch was added after c86d4b3, therefore it does not
      # exist in the c86d4b3 source tree.
      # ============================================================
      - name: Checkout UI patch
        uses: actions/checkout@v6
        with:
          repository: jmqyl/RTLPlayground
          ref: main
          path: patch-source
          sparse-checkout: |
            patches/ry-4gt-2sx-ui-mod.patch
          sparse-checkout-cone-mode: false

      # ============================================================
      # 3. Install UI patch into source tree
      # ============================================================
      - name: Install UI patch
        run: |
          set -e

          echo "======================================"
          echo " Installing UI patch"
          echo "======================================"

          if [ ! -f "patch-source/patches/ry-4gt-2sx-ui-mod.patch" ]; then
            echo
            echo "ERROR: Patch was not found in jmqyl/RTLPlayground main!"
            echo
            echo "Expected:"
            echo "patch-source/patches/ry-4gt-2sx-ui-mod.patch"
            exit 1
          fi

          mkdir -p patches

          cp \
            patch-source/patches/ry-4gt-2sx-ui-mod.patch \
            patches/ry-4gt-2sx-ui-mod.patch

          echo
          echo "Patch installed:"
          ls -lh patches/ry-4gt-2sx-ui-mod.patch

      # ============================================================
      # 4. Install build dependencies
      # ============================================================
      - name: Install dependencies
        run: |
          set -e

          echo "======================================"
          echo " Installing dependencies"
          echo "======================================"

          apt-get update

          apt-get install -y \
            make \
            gcc \
            sdcc \
            xxd \
            python3 \
            python-is-python3 \
            libjson-c-dev \
            file \
            coreutils \
            patch \
            ca-certificates

          echo
          echo "===== Tool versions ====="

          echo
          echo "make:"
          make --version | head -n 1

          echo
          echo "sdcc:"
          sdcc --version | head -n 2

          echo
          echo "gcc:"
          gcc --version | head -n 1

          echo
          echo "python:"
          python3 --version

          echo
          echo "patch:"
          patch --version | head -n 1

      # ============================================================
      # 5. Verify source tree
      # ============================================================
      - name: Verify source tree
        run: |
          set -e

          echo "======================================"
          echo " SOURCE TREE"
          echo "======================================"

          echo
          echo "Current directory:"
          pwd

          echo
          echo "Important files:"

          test -f Makefile
          test -f machine.c
          test -f config.txt

          echo "OK: Makefile"
          echo "OK: machine.c"
          echo "OK: config.txt"

          echo
          echo "HTML directory:"
          test -d html
          echo "OK: html/"

          echo
          echo "HTTPD directory:"
          test -d httpd
          echo "OK: httpd/"

      # ============================================================
      # 6. Check UI patch
      # ============================================================
      - name: Check UI patch
        run: |
          set -e

          echo "======================================"
          echo " CHECKING UI PATCH"
          echo "======================================"

          if [ ! -f "patches/ry-4gt-2sx-ui-mod.patch" ]; then
            echo
            echo "ERROR: UI patch not found!"
            exit 1
          fi

          echo
          echo "Patch:"
          echo "patches/ry-4gt-2sx-ui-mod.patch"

          echo
          echo "Size:"
          stat -c "%s bytes" \
            patches/ry-4gt-2sx-ui-mod.patch

          echo
          echo "First lines:"
          head -n 10 \
            patches/ry-4gt-2sx-ui-mod.patch

      # ============================================================
      # 7. Dry-run patch
      #
      # IMPORTANT:
      # Do NOT use --3way here.
      # We expect the patch to match c86d4b3 directly.
      # ============================================================
      - name: Check patch compatibility
        run: |
          set -e

          echo "======================================"
          echo " CHECKING PATCH COMPATIBILITY"
          echo "======================================"

          patch \
            --dry-run \
            -p1 \
            < patches/ry-4gt-2sx-ui-mod.patch

          echo
          echo "======================================"
          echo " PATCH CHECK PASSED"
          echo "======================================"

      # ============================================================
      # 8. Apply UI patch
      # ============================================================
      - name: Apply UI patch
        run: |
          set -e

          echo "======================================"
          echo " APPLYING UI PATCH"
          echo "======================================"

          patch \
            -p1 \
            < patches/ry-4gt-2sx-ui-mod.patch

          echo
          echo "======================================"
          echo " UI PATCH APPLIED"
          echo "======================================"

      # ============================================================
      # 9. Verify machine target
      # ============================================================
      - name: Verify machine target
        run: |
          set -e

          echo "======================================"
          echo " CHECKING MACHINE TARGET"
          echo "======================================"

          echo
          echo "Searching for:"
          echo "SWGT024_V2_0_UNMANAGED"

          if grep -R \
            "SWGT024_V2_0_UNMANAGED" \
            machine.c \
            Makefile \
            config.txt \
            2>/dev/null; then

            echo
            echo "======================================"
            echo " MACHINE TARGET FOUND"
            echo "======================================"

          else

            echo
            echo "ERROR:"
            echo "SWGT024_V2_0_UNMANAGED not found!"

            exit 1
          fi

      # ============================================================
      # 10. Display build configuration
      # ============================================================
      - name: Display build configuration
        run: |
          echo "======================================"
          echo " RY-4GT-2SX BUILD"
          echo "======================================"
          echo
          echo "Board       : RY-4GT-2SX"
          echo "PCB         : FG-4GT-2SX_V2.0"
          echo "Chip        : RTL8372N"
          echo "Ports       : 4 x 2.5G + 2 x SFP+"
          echo
          echo "Machine     : SWGT024_V2_0_UNMANAGED"
          echo
          echo "Base commit : c86d4b3"
          echo "Version     : v0.1.0"
          echo
          echo "Expected:"
          echo "512 KiB"
          echo "524288 bytes"
          echo
          echo "======================================"

      # ============================================================
      # 11. Clean build
      # ============================================================
      - name: Clean build
        run: |
          set -e

          echo "======================================"
          echo " CLEAN BUILD"
          echo "======================================"

          make clean || true

          rm -rf output
          rm -rf release

          mkdir -p output
          mkdir -p release

      # ============================================================
      # 12. Build firmware
      # ============================================================
      - name: Build firmware
        run: |
          set -e

          echo "======================================"
          echo " BUILDING FIRMWARE"
          echo "======================================"

          echo
          echo "MACHINE=SWGT024_V2_0_UNMANAGED"
          echo

          make MACHINE=SWGT024_V2_0_UNMANAGED

          echo
          echo "======================================"
          echo " BUILD FINISHED"
          echo "======================================"

      # ============================================================
      # 13. List build output
      # ============================================================
      - name: List build output
        run: |
          echo "======================================"
          echo " BUILD OUTPUT"
          echo "======================================"

          echo
          echo "All files:"

          find output \
            -type f \
            -exec ls -lh {} \;

          echo
          echo "BIN files:"

          find output \
            -type f \
            -name "*.bin" \
            -exec ls -lh {} \;

      # ============================================================
      # 14. Find firmware
      # ============================================================
      - name: Find firmware
        run: |
          set -e

          echo "======================================"
          echo " FINDING FIRMWARE"
          echo "======================================"

          BIN=$(find output \
            -type f \
            -name "*.bin" \
            | head -n 1)

          if [ -z "$BIN" ]; then
            echo
            echo "ERROR: No .bin firmware found!"
            exit 1
          fi

          echo
          echo "Firmware found:"
          echo "$BIN"

          echo
          echo "File information:"
          file "$BIN"

          echo
          echo "Firmware size:"
          stat -c "%s bytes" "$BIN"

      # ============================================================
      # 15. Verify firmware size
      # ============================================================
      - name: Verify firmware size
        run: |
          set -e

          echo "======================================"
          echo " FIRMWARE SIZE CHECK"
          echo "======================================"

          BIN=$(find output \
            -type f \
            -name "*.bin" \
            | head -n 1)

          if [ -z "$BIN" ]; then
            echo "ERROR: Firmware not found!"
            exit 1
          fi

          SIZE=$(stat -c%s "$BIN")

          echo
          echo "Firmware : $BIN"
          echo "Actual   : $SIZE bytes"
          echo "Expected : 524288 bytes"
          echo

          if [ "$SIZE" -ne 524288 ]; then

            echo "======================================"
            echo " ERROR: WRONG FIRMWARE SIZE"
            echo "======================================"
            echo
            echo "The firmware must be exactly:"
            echo "524288 bytes = 512 KiB"
            echo
            echo "Actual:"
            echo "$SIZE bytes"
            echo

            exit 1
          fi

          echo "======================================"
          echo " 512 KiB CHECK PASSED"
          echo "======================================"

      # ============================================================
      # 16. Calculate source firmware checksum
      # ============================================================
      - name: Calculate firmware checksum
        run: |
          set -e

          BIN=$(find output \
            -type f \
            -name "*.bin" \
            | head -n 1)

          echo "======================================"
          echo " FIRMWARE CHECKSUM"
          echo "======================================"

          echo
          echo "MD5:"
          md5sum "$BIN"

          echo
          echo "SHA256:"
          sha256sum "$BIN"

      # ============================================================
      # 17. Prepare final firmware
      # ============================================================
      - name: Prepare final firmware
        run: |
          set -e

          echo "======================================"
          echo " PREPARING FINAL FIRMWARE"
          echo "======================================"

          BIN=$(find output \
            -type f \
            -name "*.bin" \
            | head -n 1)

          FINAL="release/rtlplayground-RY-4GT-2SX.bin"

          cp "$BIN" "$FINAL"

          echo
          echo "Final firmware:"
          echo "$FINAL"

          echo
          echo "Size:"
          stat -c "%s bytes" "$FINAL"

      # ============================================================
      # 18. Final verification
      # ============================================================
      - name: Final verification
        run: |
          set -e

          FINAL="release/rtlplayground-RY-4GT-2SX.bin"

          echo "======================================"
          echo " FINAL VERIFICATION"
          echo "======================================"

          if [ ! -f "$FINAL" ]; then
            echo
            echo "ERROR: Final firmware not found!"
            exit 1
          fi

          SIZE=$(stat -c%s "$FINAL")

          echo
          echo "File:"
          echo "$FINAL"

          echo
          echo "Size:"
          echo "$SIZE bytes"

          if [ "$SIZE" -ne 524288 ]; then
            echo
            echo "ERROR: Final firmware is not 512 KiB!"
            exit 1
          fi

          echo
          echo "MD5:"
          md5sum "$FINAL"

          echo
          echo "SHA256:"
          sha256sum "$FINAL"

          echo
          echo "======================================"
          echo " FINAL CHECK PASSED"
          echo "======================================"

      # ============================================================
      # 19. Upload final firmware
      # ============================================================
      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: RY-4GT-2SX-Firmware
          path: release/rtlplayground-RY-4GT-2SX.bin
          if-no-files-found: error
          retention-days: 30

      # ============================================================
      # 20. Upload build output
      # ============================================================
      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: RY-4GT-2SX-Build-Output
          path: output/
          if-no-files-found: error
          retention-days: 30
